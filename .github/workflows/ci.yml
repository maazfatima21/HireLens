name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            worker/package-lock.json
            client/package-lock.json
      - name: Server install
        working-directory: server
        run: npm ci
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Server build
        working-directory: server
        run: npm run build
      - name: Worker install
        working-directory: worker
        run: npm ci
      - name: Worker tests
        working-directory: worker
        run: npm test
      - name: Worker build
        working-directory: worker
        run: npm run build
      - name: Client install
        working-directory: client
        run: npm ci
      - name: Client build
        working-directory: client
        run: npm run build
      - name: Validate production Compose
        env:
          CLIENT_URL: https://example.invalid
          MONGODB_URI: mongodb://example.invalid/hirelens
          JWT_SECRET: 01234567890123456789012345678901
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_RESUME_BUCKET: resumes
          GEMINI_API_KEY: ci-placeholder
          DOMAIN: example.invalid
          ACME_EMAIL: ops@example.invalid
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build deployment images
        run: |
          docker build -t hirelens-server:ci ./server
          docker build -t hirelens-worker:ci ./worker
          docker build --build-arg VITE_API_URL=/api -t hirelens-client:ci ./client
