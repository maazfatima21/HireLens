name: Deploy preparation
on:
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -t hirelens-server ./server
          docker build -t hirelens-worker ./worker
          docker build -t hirelens-client ./client
      # Configure the target container registry and deployment service
      # through GitHub Secrets before enabling push/deploy steps.
